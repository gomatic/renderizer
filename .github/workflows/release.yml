# Managed by nicerobot/tools.repository (distribute-build)
name: release
on:
  push:
    branches: [main]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.tag.outputs.version }}
      bumped: ${{ steps.tag.outputs.bumped }}
    steps:
      # Full history + tags so the SemVer computation sees every prior tag; default
      # persist-credentials (true) is REQUIRED here — this job pushes the new tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Opt out per repo by committing a `.no-autorelease` file to the root: the
      # action detects it and no-ops, so re-distribution can't silently re-enable it.
      - id: tag
        uses: nicerobot/tools.build/tag@v2

  # Publishing the tag's artifacts. Without this the tag job mints a version that
  # nothing ever builds: binaries are never attached to the release and, for a
  # repo whose goreleaser config has a `dockers:` stanza, the published image
  # silently keeps serving whatever was last pushed by hand. A repo consumed as a
  # GitHub Action then runs stale code indefinitely while its source looks current.
  #
  # Gated on a real bump, then on the repo actually having a goreleaser config, so
  # a library with nothing to publish skips cleanly rather than failing. The
  # config probe is a step rather than a job-level `if`: hashFiles is unavailable
  # in that context, and nothing is checked out there to hash anyway.
  publish:
    needs: release
    if: needs.release.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      # Check out the tag, not the branch: goreleaser derives the version from the
      # checked-out ref, and the branch tip is not the tag it just created.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.version }}
          persist-credentials: false
      - id: cfg
        shell: bash
        run: |
          if [ -f .goreleaser.yml ] || [ -f .goreleaser.yaml ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "no goreleaser config — nothing to publish for this repo"
          fi
      - uses: actions/setup-go@v5
        if: steps.cfg.outputs.present == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      # goreleaser fails a `dockers:` push without a registry login; for a repo
      # that only builds binaries this is a harmless no-op.
      - uses: docker/login-action@v3
        if: steps.cfg.outputs.present == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        if: steps.cfg.outputs.present == 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
